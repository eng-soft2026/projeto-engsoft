name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Tests
              run: npm run test

            - name: Build
              run: npm run build

    integration:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: hotel_booking_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

        env:
            DATABASE_URL: mysql://root:root@127.0.0.1:3306/hotel_booking_test
            REDIS_URL: redis://127.0.0.1:6379/15

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Apply migrations
              run: npm run prisma:migrate:deploy

            - name: Integration tests
              run: npm run test:integration

    security:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Dependency audit
              run: npm run audit:check

            - name: Secret scanning
              run: >-
                  docker run --rm -v "$GITHUB_WORKSPACE:/repo"
                  ghcr.io/gitleaks/gitleaks:v8.30.1
                  git /repo --log-opts="--all" --redact --no-banner --exit-code 1
