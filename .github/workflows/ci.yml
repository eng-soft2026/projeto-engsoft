name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Tests
              run: npm run test

            - name: Build
              run: npm run build

    security:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Dependency audit
              run: npm run audit:check

            - name: Secret scanning
              run: >-
                  docker run --rm -v "$GITHUB_WORKSPACE:/repo"
                  ghcr.io/gitleaks/gitleaks:v8.30.1
                  git /repo --log-opts="--all" --redact --no-banner --exit-code 1
